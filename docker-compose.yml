services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: foodbot
      POSTGRES_USER: foodbot
      POSTGRES_PASSWORD: foodbot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodbot -d foodbot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Runs migrations once before the app service starts. Idempotent —
  # the _migrations table records applied filenames.
  migrate:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://foodbot:foodbot@postgres:5432/foodbot
      REDIS_URL: redis://redis:6379
    env_file: .env
    command: ["npm", "run", "migrate"]
    restart: no

  # Optional: seed menu data on first install.
  # `docker compose --profile seed up`
  seed:
    build: .
    profiles: ["seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://foodbot:foodbot@postgres:5432/foodbot
      REDIS_URL: redis://redis:6379
    env_file: .env
    command: ["npm", "run", "seed"]
    restart: no

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      DATABASE_URL: postgres://foodbot:foodbot@postgres:5432/foodbot
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    healthcheck:
      # /healthz returns 503 when any BullMQ worker heartbeat is missing
      # or any dependency is unreachable — gate load balancers on it.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    command: ["npm", "run", "dev"]

volumes:
  pgdata:
