services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: foodbot
      POSTGRES_USER: foodbot
      POSTGRES_PASSWORD: foodbot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodbot -d foodbot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://foodbot:foodbot@postgres:5432/foodbot
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    command: ["npm", "run", "dev"]

volumes:
  pgdata: